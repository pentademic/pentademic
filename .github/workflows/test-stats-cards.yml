name: Generate GitHub Stats Cards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: stats-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Generate cards from public GitHub data
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await require('./scripts/generate-stats.cjs')({github, context});
      - name: Validate generated SVGs
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for name in ['github-stats.svg', 'top-languages.svg']:
              root = ET.parse('dist-stats/' + name).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg'
              assert len(root.findall('.//{http://www.w3.org/2000/svg}text')) >= 3
          PY
      - name: Publish cards to stats branch
        if: github.event_name != 'pull_request'
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: stats
          build_dir: dist-stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
