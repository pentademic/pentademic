name: Verify Stats Cards

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Runs daily at 08:00 UTC to catch any prolonged outages
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  verify:
    name: Verify GitHub stats card URLs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Check GitHub API (stats cards data source)
        run: |
          # The two stats cards now call the GitHub REST API directly.
          # Verify the user endpoint returns a 200 with valid JSON.
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -s -o /tmp/gh-user.json -w "%{http_code}" \
              "https://api.github.com/users/pentademic")
            echo "GitHub API HTTP status (attempt $attempt): $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              if ! grep -q '"login"' /tmp/gh-user.json; then
                echo "::error::GitHub API response does not contain expected user data"
                cat /tmp/gh-user.json
                exit 1
              fi
              echo "GitHub API OK"
              break
            elif [ "$HTTP_CODE" -ge 500 ] 2>/dev/null && [ "$attempt" -lt 3 ]; then
              echo "::warning::GitHub API returned HTTP $HTTP_CODE (server error), retrying in 10 s…"
              sleep 10
            else
              echo "::error::GitHub API returned HTTP $HTTP_CODE after $attempt attempt(s)"
              exit 1
            fi
          done

      - name: Check streak stats
        run: |
          # Streak is an optional external badge. Keep outages visible without
          # treating provider downtime as a regression in this repository.
          for attempt in 1 2 3; do
            HTTP_CODE="000"
            if HTTP_CODE=$(curl -sS -L --connect-timeout 5 --max-time 15 \
              -o /tmp/streak.svg -w "%{http_code}" \
              "https://streak-stats.demolab.com?user=pentademic&theme=tokyonight&hide_border=true&date_format=j%20M%5B%20Y%5D"); then
              CURL_EXIT=0
            else
              CURL_EXIT=$?
            fi
            echo "Streak stats HTTP status (attempt $attempt): $HTTP_CODE"
            if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" = "200" ]; then
              if ! grep -qi '<svg[[:space:]>]' /tmp/streak.svg; then
                echo "::error::Streak stats returned HTTP 200 without an SVG"
                exit 1
              fi
              echo "Streak stats OK"
              exit 0
            fi
            if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" = "429" ] || [[ "$HTTP_CODE" =~ ^5[0-9][0-9]$ ]]; then
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::Streak provider unavailable (HTTP $HTTP_CODE, curl $CURL_EXIT); retrying in 5 s"
                sleep 5
              else
                echo "::warning::Optional Streak badge unavailable after 3 attempts (HTTP $HTTP_CODE, curl $CURL_EXIT)"
                echo "### Optional Streak badge unavailable" >> "$GITHUB_STEP_SUMMARY"
                echo "Provider returned HTTP $HTTP_CODE (curl exit $CURL_EXIT) after 3 attempts. Profile content checks are unaffected." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            else
              echo "::error::Streak stats returned unexpected HTTP $HTTP_CODE"
              exit 1
            fi
          done
