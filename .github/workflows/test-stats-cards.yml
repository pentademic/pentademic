name: Verify Stats Cards

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Runs daily at 08:00 UTC to catch any prolonged outages
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  verify:
    name: Verify GitHub stats card URLs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Check GitHub API (stats cards data source)
        run: |
          # The two stats cards now call the GitHub REST API directly.
          # Verify the user endpoint returns a 200 with valid JSON.
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -s -o /tmp/gh-user.json -w "%{http_code}" \
              "https://api.github.com/users/pentademic")
            echo "GitHub API HTTP status (attempt $attempt): $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              if ! grep -q '"login"' /tmp/gh-user.json; then
                echo "::error::GitHub API response does not contain expected user data"
                cat /tmp/gh-user.json
                exit 1
              fi
              echo "GitHub API OK"
              break
            elif [ "$HTTP_CODE" -ge 500 ] 2>/dev/null && [ "$attempt" -lt 3 ]; then
              echo "::warning::GitHub API returned HTTP $HTTP_CODE (server error), retrying in 10 s…"
              sleep 10
            else
              echo "::error::GitHub API returned HTTP $HTTP_CODE after $attempt attempt(s)"
              exit 1
            fi
          done

      - name: Check streak stats
        run: |
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -s -o /tmp/streak.svg -w "%{http_code}" \
              "https://streak-stats.demolab.com?user=pentademic&theme=tokyonight&hide_border=true&date_format=j%20M%5B%20Y%5D")
            echo "Streak stats HTTP status (attempt $attempt): $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Streak stats OK"
              break
            elif [ "$HTTP_CODE" -ge 500 ] 2>/dev/null && [ "$attempt" -lt 3 ]; then
              echo "::warning::Streak stats returned HTTP $HTTP_CODE (server error), retrying in 10 s…"
              sleep 10
            else
              echo "::error::Streak stats returned HTTP $HTTP_CODE after $attempt attempt(s)"
              exit 1
            fi
          done
